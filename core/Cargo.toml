[package]
name = "core"
version = "0.1.0"
edition = "2021"

# When this package grows more binaries in later phases (a baseline model
# runner, a boosting runner, etc. — same pattern as your other Rust
# projects), `default-run` tells `cargo run` (with no other args) which one
# to launch. Right now there's only one binary, but setting this explicitly
# now means adding a second binary later won't make `cargo run` ambiguous.
default-run = "nppad-fault-diagnosis"

[[bin]]
name = "nppad-fault-diagnosis"
path = "src/main.rs"

[dependencies]
# `csv` + `serde` are pure I/O plumbing (reading rows off disk into typed
# structs) — not differentiating logic, so per your dependency philosophy
# these are exactly the kind of thing that belongs as a crate rather than
# hand-rolled. The actual statistics/EDA math in `eda.rs` is hand-rolled.
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# `anyhow` gives us a single, ergonomic error type (`anyhow::Result<T>`) so
# we're not stuck writing a custom error enum for every place a file read or
# parse could fail. This is a very common "plumbing" crate in Rust CLIs.
anyhow = "1.0"
