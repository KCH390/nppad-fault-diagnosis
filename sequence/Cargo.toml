[package]
name = "sequence"
version = "0.1.0"
edition = "2021"

default-run = "train-lstm"

[[bin]]
name = "train-lstm"
path = "src/bin/train_lstm.rs"

[dependencies]
core = { path = "../core" }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# `candle-core` is the tensor/autodiff library, `candle-nn` provides the
# LSTM layer, linear layers, optimizers, and loss functions built on top
# of it, the Rust-native equivalent of what PyTorch's `torch` + `torch.nn`
# split provides. Pinned to a specific minor version since candle's public
# API (particularly around `candle_nn::rnn`) has shifted across releases.
# If `cargo build` reports a signature mismatch against whatever version
# actually resolves, check the installed version's docs.rs page for
# `candle_nn::rnn::LSTM`/`RNN` and adjust call sites accordingly. The
# underlying LSTM math implemented in `lstm.rs` doesn't depend on the
# exact API shape, only the plumbing around it does.
candle-core = "0.7"
candle-nn = "0.7"

# KNOWN RESOLUTION ISSUE: candle-core 0.7.2's own source uses the `rand
# 0.8` API directly (`rand::distributions::Uniform`), but several of its
# other dependencies (rayon-core, safetensors's zip dependency, etc.) pull
# in `rand 0.9` and a matching `half` release built against it. Cargo is
# happy to resolve both `rand` versions into the dependency graph at once
# (that's allowed), but `half`'s f16/bf16 types then don't implement the
# `rand 0.8` traits candle-core's code expects, which surfaces as
# `SampleUniform`/`SampleBorrow` compile errors inside candle-core itself,
# not in this crate's own code. If you hit that, force the resolver back
# onto the rand-0.8-compatible version set:
#   cargo update -p half --precise 2.4.1
#   cargo update -p rand_distr --precise 0.4.3
#   cargo update -p rand --precise 0.8.5
# then rebuild. This is a candle-core/half ecosystem version mismatch, not
# anything specific to this project's own code.
