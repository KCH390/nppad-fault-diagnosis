[workspace]
resolver = "2"
members = ["core", "charts", "models", "physics", "sequence"]

# `default-members` controls what `cargo build` / `cargo run` act on when you
# don't pass `-p <crate>`. We only want `core` built by default: it's the
# dependency-light crate with the data loading and EDA logic. `charts` pulls
# in `plotters`, `models` pulls in `linfa`/`smartcore`, `physics` depends on
# `core` and adds its own binary, and `sequence` pulls in `candle-core`/
# `candle-nn` — all four stay opt-in (`cargo run -p <crate>`) rather than
# part of the default build. This keeps `cargo build` fast and keeps
# `cargo tree` for `core` clean when we check dependency hygiene after each
# phase.
default-members = ["core"]
